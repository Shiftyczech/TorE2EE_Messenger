version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=3000
      - DATABASE_URL=sqlite:///app/data/relay.db
    volumes:
      - backend-data:/app/data
    # DŮLEŽITÉ: Záměrně zde chybí sekce "ports".
    # Backend nesmí být dostupný z běžného internetu, pouze přes Tor.

  tor:
    image: osminogin/tor-simple:latest
    restart: unless-stopped
    volumes:
      - ./torrc:/etc/tor/torrc:ro
      - tor-keys:/var/lib/tor/hidden_service/
    depends_on:
      - backend

volumes:
  backend-data:
    # Uchovává zašifrovanou frontu zpráv
  tor-keys:
    # KRITICKÉ: Zde jsou uloženy klíče k vaší .onion adrese.
    # Pokud tento volume smažete, adresa zanikne a vygeneruje se nová.

